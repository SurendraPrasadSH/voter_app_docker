apiVersion: v1
kind: Pod
metadata:
  name: db
  labels:
    name: postgres-pod
    app: demo-voting-app
spec:
  containers:
    - name: postgres-app
      image: postgres
      ports: 
      - containerPort: 5432
      env:
        - name: POSTGRES_PASSWORD
          value: "postgres"
        - name: POSTGRES_USER
          value: "postgres"